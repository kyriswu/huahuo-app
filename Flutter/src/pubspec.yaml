name: huahuoai_app
description: Infinite Huahuo Flutter application.
publish_to: none

resolution: workspace

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^10.3.1
  go_router: ^14.2.7
  huahuo_foundation:
    path: ../packages/huahuo_foundation
  huahuo_editor:
    path: ../packages/huahuo_editor
  huahuo_api:
    path: ../packages/huahuo_api
  huahuo_product:
    path: ../packages/huahuo_product
  audio_session: ^0.2.4
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  sqlite3: ^3.3.4
  liquid_glass_widgets: ^0.21.3
  lucide_icons_flutter: ^3.1.15
  crypto: ^3.0.6
  characters: ^1.4.1
  image: ^4.5.4
  flutter_quill: 11.5.1
  pdf: 3.12.0
  package_info_plus: 10.2.1
  in_app_purchase: 3.3.0
  url_launcher: 6.3.2
  jpush_flutter:
    path: ../vendor/jpush_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/demo_person_assets_zh_CN.json
    - assets/data/knowledge_channels_zh_CN.json
    - assets/help/zh-CN/
    - assets/help/zh-CN/articles/
    - assets/help/zh-CN/images/
    - assets/legal/
    - assets/images/huahuo_brand_mark.png
    - android/app/src/main/res/drawable-xxxhdpi/launch_logo.png
    - assets/images/recording_card_device.png
    - assets/images/knowledge_square_banner.png
    - assets/images/knowledge_publications/
    - assets/images/knowledge_article_claude.png
    - assets/images/knowledge_article_copyright.png
    - assets/images/knowledge_channel_ai_depth.png
    - assets/images/knowledge_channel_business.png
    - assets/images/knowledge_channel_chinese_culture.png
    - assets/images/knowledge_channel_health.png
    - assets/images/knowledge_channel_law.png
    - assets/images/knowledge_channel_wellness.png
    - assets/images/knowledge_random_business.png
    - assets/images/knowledge_today_ai.png
    - assets/images/knowledge_today_city.png
    - assets/images/chat_firework_mark.png
    - assets/images/workbench_personal_ip.png
    - assets/images/workbench_lead_marketing.png
    - assets/images/workbench_visual_design.png
    - assets/images/workbench_video_analysis.png
    - assets/fonts/NotoSansSC-Regular.ttf
    - assets/fonts/NotoSansSC-Variable.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
